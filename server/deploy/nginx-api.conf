# api.youyisida.com - ngược thay thế đến gốc máy móc Node API(:3000)
# đưa vào hồ sơ: trường con tên api phải đã tồn tại Ali nói ICP truy cập, nếu không thì mạng công cộng HTTP có thể chăn đánh chặn
# HTTPS: triển khai tốt 80 hoàng hậu thực hiện certbot --nginx -d api.youyisida.com

server {
    listen 80;
    server_name api.youyisida.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

