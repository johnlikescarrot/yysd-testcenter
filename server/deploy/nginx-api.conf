# api.youyisida.com — phản thay đến bản cơ Node API (:3000)
# lập hồ sơ: tử vực tên api tu đã ở a lý vân ICP tiếp nhập, nếu không công mạng lưới HTTP sẽ bị chặn đường
# HTTPS: phối trí tốt 80 sau chấp hành certbot --nginx -d api.youyisida.com

server {
    listen 80;
    server_name api.youyisida.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

