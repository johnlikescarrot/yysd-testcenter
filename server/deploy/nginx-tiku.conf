# tiku.youyisida.com - ngân hàng câu hỏi trung tâm tĩnh trạm(giáo viên cuối mở; trình duyệt thẳng tá chỉ nhìn thấy chỉ ra)
# nhân bản đến /etc/nginx/sites-available/tiku.youyisida.com và ln -s
# chứng chỉ: certbot --nginx -d tiku.youyisida.com
# lắp đặt che phủ đừng! đặt trang web chính thức cần biến thể cũ của | đặt đến /opt/yysd/private/tiku/ lại riêng tư gửi đi liên kết 

server {
    listen 80;
    server_name tiku.youyisida.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tiku.youyisida.com;
    root /opt/yysd/tiku;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tiku.youyisida.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiku.youyisida.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~* \.(html|js|css)$ {
        etag off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
