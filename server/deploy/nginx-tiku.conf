# tiku.youyisida.com — Ngân hàng đề trung tâm trạng thái tĩnh đứng (Giáo viên đầu mở ra; trình duyệt thẳng đánh chỉ thấy nhắc nhở)
# phục chế đến /etc/nginx/sites-available/tiku.youyisida.com cũng ln -s
# giấy chứng nhận: certbot --nginx -d tiku.youyisida.com
# lắp đặt bao không nên thả Website Games. lúc cần phải phóng tới /opt/yysd/private/tiku/ lại lén lút gửi kết nối.

server {
    listen 80;
    server_name tiku.youyisida.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tiku.youyisida.com;
    root /opt/yysd/tiku;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tiku.youyisida.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiku.youyisida.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~* \.(html|js|css)$ {
        etag off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
