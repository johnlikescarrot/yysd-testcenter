# youyisida.com — trạng thái tĩnh đứng + Đăng nhập gác cổng (/library cần cookie)
# nhiều người thuê: thông xứng phù *.youyisida.com chỉ hướng đồng nhất bộ trạng thái tĩnh văn bản tài liệu
# HTTPS: thông xứng phù giấy chứng nhận cần DNS nghiệm chứng, gặp docs/multi-tenant.md
# đổi mới sau nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name youyisida.com www.youyisida.com *.youyisida.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name youyisida.com www.youyisida.com *.youyisida.com;
    root /opt/yysd/web;
    index index.html;

    # thông xứng phù giấy chứng nhận đường nhỏ (theo như certbot thực tế mục lục điều chỉnh)
    ssl_certificate /etc/letsencrypt/live/youyisida.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youyisida.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /data/ {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    location ^~ /library/ {
        if ($cookie_yysd_auth!= "1") {
            return 302 https://$host/login.html?next=$request_uri;
        }
        # Papers change in place; without this, browsers keep stale HTML/maps.
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # nội dung thượng truyền(*upload) hậu trường: Chưa đăng nhập không thể tiến (trang bên trong có khác Giáo viên / Quản trị viên nhân vật kiểm tra)
    # ponytail: exact /admin/ must redirect — index module can skip if+try_files
    location = /admin {
        return 302 /admin/index.html;
    }
    location = /admin/ {
        return 302 /admin/index.html;
    }
    location ^~ /admin/ {
        if ($cookie_yysd_auth!= "1") {
            return 302 https://$host/login.html?next=$request_uri;
        }
        try_files $uri =404;
    }

    # huy hiệu trường đi bản cơ trạng thái tĩnh mục lục, chớ vào Next (Next đối với /admission/logos/* sẽ 400)
    # mục lục dùng sync-web ra đường nhỏ, tránh cho rsync --delete lầm xóa; bố trí: rsync admission/public/logos/ → nơi này
    location ^~ /admission/logos/ {
        alias /opt/yysd/school-logos/;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # AI học lên cố vấn (Next.js @:3001; tạm thời vẻn vẹn tổng bộ đứng youyisida.com)
    location ^~ /admission {
        if ($host!~* ^(youyisida\.com|www\.youyisida\.com)$) {
            return 403;
        }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 12m;
    }

    # toàn cầu đại học bài danh (Next.js @:3002; tạm thời vẻn vẹn tổng bộ đứng youyisida.com)
    location ^~ /rankings {
        if ($host!~* ^(youyisida\.com|www\.youyisida\.com)$) {
            return 403;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # exam.html holds the CONTENT_VER script tag; stale copies pin old papers.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Multi-page site: never fall back to index.html (masks missing.js as HTML).
    location / {
        try_files $uri $uri/ =404;
    }
}
