# youyisida.com - tĩnh trạm + đăng ký hạn chế ra vào(/library yêu cầu cookie)
# nhiều người thuê: ký tự đại diện *.youyisida.com chỉ về giống hệt che đậy tĩnh tài liệu
# HTTPS: ký tự đại diện chứng chỉ yêu cầu DNS kiểm tra và xác minh, thấy docs/multi-tenant.md
# thay cũ đổi mới hoàng hậu nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name youyisida.com www.youyisida.com *.youyisida.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name youyisida.com www.youyisida.com *.youyisida.com;
    root /opt/yysd/web;
    index index.html;

    # ký tự đại diện chứng chỉ con đường(nhấn certbot thực tế mục lục điều chỉnh)
    ssl_certificate /etc/letsencrypt/live/youyisida.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youyisida.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /data/ {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    location ^~ /library/ {
        if ($cookie_yysd_auth != "1") {
            return 302 https://$host/login.html?next=$request_uri;
        }
        # Papers change in place; without this, browsers keep stale HTML/maps.
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # nội dung tải lên khu vực hậu trường: chưa đăng ký không thể tiến lên(đầu bên trong có điều gì khác giáo viên/người quản lý vai trò kiểm tra)
    # ponytail: exact /admin/ must redirect - index module can skip if+try_files
    location = /admin {
        return 302 /admin/index.html;
    }
    location = /admin/ {
        return 302 /admin/index.html;
    }
    location ^~ /admin/ {
        if ($cookie_yysd_auth != "1") {
            return 302 https://$host/login.html?next=$request_uri;
        }
        try_files $uri =404;
    }

    # huy hiệu trường đi gốc máy móc tĩnh mục lục, rời khỏi tiến lên Next(Next đối với /admission/logos/* có thể 400)
    # mục lục sử dụng sync-web bên ngoài của con đường, ngăn chặn rsync --delete nhầm lỗi xóa; bố trí: rsync admission/public/logos/ → nơi này
    location ^~ /admission/logos/ {
        alias /opt/yysd/school-logos/;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # AI lên lớp hoặc trường cấp trên cố vấn(Next.js @ :3001; tạm thời hầu như trụ sở chính trạm youyisida.com)
    location ^~ /admission {
        if ($host !~* ^(youyisida\.com|www\.youyisida\.com)$) {
            return 403;
        }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 12m;
    }

    # toàn thế giới Đại học xếp hạng(Next.js @ :3002; tạm thời hầu như trụ sở chính trạm youyisida.com)
    location ^~ /rankings {
        if ($host !~* ^(youyisida\.com|www\.youyisida\.com)$) {
            return 403;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # exam.html holds the CONTENT_VER script tag; stale copies pin old papers.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Multi-page site: never fall back to index.html (masks missing .js as HTML).
    location / {
        try_files $uri $uri/ =404;
    }
}
