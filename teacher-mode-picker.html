<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lựa chọn sử dụng hình thức · Cổng giáo viên</title>
  <meta name="description" content="Trung tâm Luyện thi IELTS Quốc tế YYSD — Kho đề Cambridge IELTS, từ vựng Anh–Việt, lộ trình thông minh và thư viện PDF học thuật Google Scholar.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=20260821tfix1">
  <link rel="stylesheet" href="assets/css/dashboard-premium.css?v=20260722polish">
</head>
<body class="home-minimal teacher-auth-page">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="teacher-mode-picker.html" class="minimal-brand" aria-label="Trung tâm Luyện thi Quốc tế YYSD">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>Trung tâm Luyện thi Quốc tế YYSD</b>
          <span>Teacher Portal</span>
        </span>
      </a>
      <nav class="minimal-nav" aria-label="Điều hướng giáo viên">
        <button type="button" class="btn btn--ghost btn--sm" id="logout-btn">Đăng xuất</button>
      </nav>
    </div>
  </header>

  <main class="minimal-shell minimal-main auth-main">
    <section class="auth-card reveal teacher-mode-picker">
      <div class="minimal-eyebrow">TEACHER MODE</div>
      <h1 class="auth-card__title">mời lựa chọn sử dụng hình thức</h1>
      <p class="auth-card__desc">Đăng nhập sau mời trước lựa chọn muốn đi vào khu vực. về sau ví dụ cần hoán đổi, xin sử dụng trang web đỉnh hình thức hoán đổi cái nút. </p>

      <div class="teacher-mode-picker__choices">
        <button type="button" class="teacher-mode-picker__btn pressable" id="pick-admin">
          <strong>phòng học quản lý khu</strong>
          <span> Xem học chuyện, bố trí nhiệm vụ, Chẩn đoán từ vựng, Vượt ải từ vựng Quản trị và Học viên Điểm số. </span>
        </button>
        <button type="button" class="teacher-mode-picker__btn pressable" id="pick-site">
          <strong>Khu tính năng học tập</strong>
          <span> dùng Học viên thị giác Dùng thử Khu từ vựng, Khu luyện tập, Khu đề thi đợi công năng và vượt ải Tiến độ. </span>
        </button>
      </div>

      <p class="auth-msg" id="msg" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> Trung tâm Luyện thi Quốc tế YYSD · Cổng giáo viên </p>
    </div>
  </footer>

  <script src="assets/js/teacher-auth.js?v=20260821gate1"></script>
  <script src="assets/js/teacher-mode.js?v=20260821gate1"></script>
  <script>
  (function () {
    var T = window.YYSD_TEACHER;
    var M = window.YYSD_TEACHER_MODE;
    var msgEl = document.getElementById("msg");

    document.getElementById("year").textContent = new Date().getFullYear();

    if (!T ||!T.getToken()) {
      location.replace("teacher-login.html?next=" + encodeURIComponent("teacher-mode-picker.html"));
      return;
    }

    function showMsg(text) {
      msgEl.textContent = text || "";
      msgEl.className = "auth-msg" + (text? " auth-msg--err": "");
    }

    document.getElementById("logout-btn").addEventListener("click", function () {
      T.logout();
    });

    document.getElementById("pick-admin").addEventListener("click", function () {
      showMsg("");
      M.enterAdminMode();
    });

    document.getElementById("pick-site").addEventListener("click", function () {
      showMsg("");
      var btn = this;
      btn.disabled = true;
      M.enterSiteMode().catch(function (err) {
        showMsg((err & err.message) || " không cách nào Vào học Khu tính năng học tập ");
        btn.disabled = false;
      });
    });
  })();
  </script>
</body>
</html>
