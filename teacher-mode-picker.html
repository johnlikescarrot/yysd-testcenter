<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chọn sử dụng chế độ · Dành cho giáo viên</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20260821tfix1">
  <link rel="stylesheet" href="assets/css/dashboard-premium.css?v=20260722polish">
</head>
<body class="home-minimal teacher-auth-page">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="teacher-mode-picker.html" class="minimal-brand" aria-label=" Trung tâm YYSD ">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>Trung tâm YYSD</b>
          <span>Teacher Portal</span>
        </span>
      </a>
      <nav class="minimal-nav" aria-label=" giáo viên điều hướng ">
        <button type="button" class="btn btn--ghost btn--sm" id="logout-btn">rút lui đăng ký</button>
      </nav>
    </div>
  </header>

  <main class="minimal-shell minimal-main auth-main">
    <section class="auth-card reveal teacher-mode-picker">
      <div class="minimal-eyebrow">TEACHER MODE</div>
      <h1 class="auth-card__title">mời chọn sử dụng chế độ</h1>
      <p class="auth-card__desc">đăng ký hoàng hậu mời trước chọn yêu cầu đi vào của khu vực sau như yêu cầu chuyển đổi, mời sử dụng trang mái của chế độ chuyển đổi nút bấm </p>

      <div class="teacher-mode-picker__choices">
        <button type="button" class="teacher-mode-picker__btn pressable" id="pick-admin">
          <strong>phòng học giám sát khu vực</strong>
          <span>xem xét học tình cảm, sắp xếp nhiệm vụ, biến thể của | chẩn đoán, từ xông qua rào cản giám sát biến thể của | học sinh thành tích </span>
        </button>
        <button type="button" class="teacher-mode-picker__btn pressable" id="pick-site">
          <strong>trang web chức năng khu vực</strong>
          <span>biến thể cũ của học sinh góc độ quan sát trải nghiệm từ khu vực, Khu vực luyện tập, câu hỏi từ đề thi các năm trước khu vực đợi chức năng biến thể của | xông qua rào cản tốc độ tiến triển </span>
        </button>
      </div>

      <p class="auth-msg" id="msg" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> Trung tâm YYSD · Dành cho giáo viên</p>
    </div>
  </footer>

  <script src="assets/js/teacher-auth.js?v=20260821gate1"></script>
  <script src="assets/js/teacher-mode.js?v=20260821gate1"></script>
  <script>
  (function () {
    var T = window.YYSD_TEACHER;
    var M = window.YYSD_TEACHER_MODE;
    var msgEl = document.getElementById("msg");

    document.getElementById("year").textContent = new Date().getFullYear();

    if (!T || !T.getToken()) {
      location.replace("teacher-login.html?next=" + encodeURIComponent("teacher-mode-picker.html"));
      return;
    }

    function showMsg(text) {
      msgEl.textContent = text || "";
      msgEl.className = "auth-msg" + (text ? " auth-msg--err" : "");
    }

    document.getElementById("logout-btn").addEventListener("click", function () {
      T.logout();
    });

    document.getElementById("pick-admin").addEventListener("click", function () {
      showMsg("");
      M.enterAdminMode();
    });

    document.getElementById("pick-site").addEventListener("click", function () {
      showMsg("");
      var btn = this;
      btn.disabled = true;
      M.enterSiteMode().catch(function (err) {
        showMsg((err && err.message) || " không thể đi vào trang web chức năng khu vực ");
        btn.disabled = false;
      });
    });
  })();
  </script>
</body>
</html>
