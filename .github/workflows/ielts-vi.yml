name: IELTS tiếng Việt · chất lượng và Pages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ielts-vi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Super-Linter · IELTS tiếng Việt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the Vietnamese edition
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            ielts-vi
            quality
            .github
      - name: Run Super-Linter
        shell: bash
        run: |
          set -o pipefail
          quality/super-lint.sh 2>&1 | tee "$RUNNER_TEMP/lint.log"
      - name: Report lint diagnostics
        if: failure()
        shell: bash
        run: |
          message=$(tail -n 40 "$RUNNER_TEMP/lint.log" | cut -c1-450)
          message=${message//%/%25}
          message=${message//$'\r'/%0D}
          message=${message//$'\n'/%0A}
          printf '::error title=Super-Linter::%s\n' "$message"

  quality:
    name: Coverage, trình duyệt và Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: quality
    steps:
      - name: Check out the Vietnamese edition
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ielts-vi/
            /quality/
            /*.html
            /assets/
            /library/*-catalog.json
            /library/*taxonomy.json
            /library/manifest.json
            /library/mock/ielts/placement-test-*.html
            /library/mock/cambridge-*/cambridge-20-test-1*.html
            /library/mock/cambridge-listening/ielts20_test1_audio1.mp3
            /library/practice/jingting/data/cam20-t1-p*.json
            /library/mock/alevel/caie/9231-further-mathematics/papers/9231_w25_qp_11.pdf
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: quality/package-lock.json
      - run: npm ci
      - name: Verify reproducible handbooks and audio
        run: |
          npm run pdf
          npm run audio
          git diff --exit-code -- ../ielts-vi/resources/ ../ielts-vi/audio/
      - run: npm test
      - run: npm run build
      - run: node legacy-smoke.mjs
      - run: npm run test:browser
      - run: npm run lighthouse
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ielts-vi-quality-reports
          path: |
            quality/coverage/
            quality/reports/
          if-no-files-found: ignore
      - name: Save static preview for the PR
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ielts-vi-static-preview
          path: |
            quality/dist/
          include-hidden-files: true
      - name: Save site for deployment
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: quality/dist

  deploy:
    name: Triển khai GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [super-linter, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages settings
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the validated edition
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
