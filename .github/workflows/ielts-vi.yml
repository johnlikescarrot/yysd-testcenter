name: IELTS tiếng Việt · Kiểm thử và GitHub Pages

on:
  push:
    branches:
      - main
      - arena/9e1a94bb-yysd-testcenter
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Kiểm thử, độ bao phủ và Lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Lấy các tệp của lộ trình tiếng Việt
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /study.html
            /.nojekyll
            /package.json
            /package-lock.json
            /assets/css/ielts-vi.css
            /assets/js/ielts-vi-*.mjs
            /assets/img/favicon.svg
            /assets/img/logo.svg
            /docs/ielts/
            /library/practice/ielts/sample-academic-reading-1.html
            /library/manifest.json
            /tests/
            /scripts/build_manifest.py
            /scripts/build_ielts_guide.py
            /scripts/audit-ielts.mjs
            /scripts/build-ielts-pages.mjs
            /scripts/lint-ielts-inline.mjs
            /scripts/report-browser-coverage.mjs
            /scripts/verify_vocab_wrongword_hooks.py
            /.github/linters/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install -r docs/ielts/requirements-pdf.txt
      # Super-Linter v9 does not classify .mjs files; lint them and the sample's inline JS separately.
      - run: npm run lint:js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run test:coverage
      - run: npm run test:browser:coverage
      - run: npm run audit
      - name: Lưu báo cáo Lighthouse và độ bao phủ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-ielts-vi
          path: |
            .lighthouse/*.json
            coverage/browser-summary.json
          # The Lighthouse directory is hidden; include only the explicitly named reports.
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Đóng gói trang tĩnh
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  super-linter:
    name: Super-Linter · các tệp mới
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Lấy mã và cấu hình lint
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /study.html
            /README.md
            /package.json
            /package-lock.json
            /assets/css/ielts-vi.css
            /assets/js/ielts-vi-*.mjs
            /docs/ielts/nghien-cuu.md
            /library/practice/ielts/sample-academic-reading-1.html
            /library/manifest.json
            /tests/
            /scripts/audit-ielts.mjs
            /scripts/build-ielts-pages.mjs
            /scripts/lint-ielts-inline.mjs
            /scripts/report-browser-coverage.mjs
            /scripts/build_ielts_guide.py
            /scripts/build_manifest.py
            /scripts/verify_vocab_wrongword_hooks.py
            /.github/linters/
            /.github/workflows/ielts-vi.yml
            /.github/workflows/build-manifest.yml
      - name: Chạy Super-Linter
        uses: super-linter/super-linter/slim@v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_LOG_FILE: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          USE_FIND_ALGORITHM: true
          VALIDATE_ALL_CODEBASE: true
          FILTER_REGEX_INCLUDE: '(^|/)(index\.html|study\.html|README\.md|package(-lock)?\.json|assets/(css/ielts-vi\.css|js/ielts-vi-[^/]+\.mjs)|library/(manifest\.json|practice/ielts/sample-academic-reading-1\.html)|tests/[^/]+\.(mjs|py)|scripts/(audit-ielts|build-ielts-pages|lint-ielts-inline|report-browser-coverage)\.mjs|scripts/(build_ielts_guide|build_manifest|verify_vocab_wrongword_hooks)\.py|docs/ielts/nghien-cuu\.md|\.github/workflows/(ielts-vi|build-manifest)\.yml)$'
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_YAML: true
      - name: Ghi chú lỗi lint để dễ chẩn đoán
        if: failure()
        shell: bash
        run: |
          if [ -s super-linter.log ]; then
            sudo tail -40 super-linter.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::warning::$line"
            done
          else
            echo '::warning::Super-Linter không tạo được nhật ký có nội dung.'
          fi

  pages:
    name: Xuất bản GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/9e1a94bb-yysd-testcenter')
    needs: [quality, super-linter]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Cấu hình Pages
        uses: actions/configure-pages@v5
      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v4
