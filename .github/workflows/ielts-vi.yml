name: IELTS Mỗi Ngày

on:
  pull_request:
    paths: ['ielts/**', '.github/workflows/ielts-vi.yml']
  push:
    branches: [main, arena/4f9b88d1-yysd-testcenter]
    paths: ['ielts/**', '.github/workflows/ielts-vi.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ielts-vi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.3'

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            ielts
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ielts/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ielts
      - name: Lint IELTS sources
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          VALIDATE_ALL_CODEBASE: true
          USE_FIND_ALGORITHM: true
          STRIP_DEFAULT_WORKSPACE_FOR_REGEX: true
          FILTER_REGEX_INCLUDE: '^ielts/|^\.github/workflows/ielts-vi\.yml$'
          LINTER_RULES_PATH: ielts
          VALIDATE_CSS: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          MULTI_STATUS: false
          CREATE_LOG_FILE: true
      - name: Expose Super-Linter diagnostics
        if: failure()
        run: |
          if [[ -f super-linter.log ]]; then
            sudo cat super-linter.log > "$RUNNER_TEMP/ielts-super-linter.log"
            grep -E -A 8 '\[(ERROR|FATAL)\]' "$RUNNER_TEMP/ielts-super-linter.log" | tail -n 35 | while IFS= read -r line; do
              printf '::error title=Super-Linter::%s\n' "${line//%/%25}"
            done
          fi
      - name: Upload Super-Linter diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ielts-super-linter
          path: ${{ runner.temp }}/ielts-super-linter.log
          if-no-files-found: ignore

  quality:
    name: Coverage, Browser, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ielts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ielts
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ielts/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - run: npm run audit
      - name: Save Lighthouse and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ielts-quality
          path: |
            ielts/reports/
            ielts/coverage/lcov.info
          if-no-files-found: ignore
      - name: Package only the public IELTS app
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/4f9b88d1-yysd-testcenter')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ielts/dist

  pages:
    name: Publish IELTS to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/4f9b88d1-yysd-testcenter')
    needs: [super-linter, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify the public homepage and a PDF
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${PAGES_URL%/}/" -o home.html
          grep -q 'Luyện IELTS,' home.html
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${PAGES_URL%/}/pdf/14-ngay-hoc-deu.pdf" -o guide.pdf
          head -c 5 guide.pdf | grep -q '^%PDF-'
