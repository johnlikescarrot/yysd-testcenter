---
name: Super-Linter

on:
  push:
    paths:
      - "vi/**"
      - "tests/**"
      - "docs/vi/**"
      - "*.md"
      - "*.json"
      - "*.js"
      - "*.mjs"
      - ".github/workflows/**"
      - "eslint.config.js"
      - ".stylelintrc.json"
      - ".htmlhintrc"
      - ".markdownlint.json"
      - ".editorconfig"
  pull_request:
    paths:
      - "vi/**"
      - "tests/**"
      - "docs/vi/**"
      - "*.md"
      - "*.json"
      - "*.js"
      - "*.mjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  statuses: write

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint mã nguồn (super-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter@v7.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          IGNORE_GITIGNORED_FILES: true
          FILTER_REGEX_EXCLUDE: (^|/)(library|assets|data|server|scripts|app|tiku)/.*
          # ESLint 9 do vi-ci.yml đảm nhiệm; super-linter tập trung CSS/HTML/MD/JSON/YAML
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_EDITORCONFIG: false
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_JSCPD: false
          VALIDATE_SPELL_CODESPELL: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_JSX: false
          VALIDATE_TSX: false
          VALIDATE_DOCKERFILE_HADOLINT: false
          VALIDATE_SHELL_SHFMT: false
          VALIDATE_BASH: false
          VALIDATE_BASH_EXEC: false
          VALIDATE_XML: false
          VALIDATE_RUBY: false
          VALIDATE_GO: false
          VALIDATE_JAVA: false
          VALIDATE_KOTLIN: false
          VALIDATE_SWIFT: false
          VALIDATE_PHP: false
          VALIDATE_POWERSHELL: false
          VALIDATE_CLANG_FORMAT: false
          VALIDATE_PROTOBUF: false
          VALIDATE_OPENAPI: false
          VALIDATE_GRAPHQL: false
          CSS_FILE_NAME: .stylelintrc.json
          HTML_HINT_CONFIG_FILE: .htmlhintrc
          MARKDOWN_CONFIG_FILE: .markdownlint.json
