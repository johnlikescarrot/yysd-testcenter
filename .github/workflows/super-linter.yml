name: Super-Linter

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  super-linter:
    name: Kiểm tra mã nguồn với GitHub Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Chạy GitHub Super-Linter
        uses: super-linter/super-linter/slim@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          FILTER_REGEX_INCLUDE: >-
            ^(src/.*|tests/.*|assets/css/duo-ielts\.css|
            assets/js/(duo-app|tai-lieu|duo-hud)\.js|
            scripts/(check_vietnamese|build_pages|serve_static)\.mjs|
            scripts/build_scholar_pdfs\.py|
            (index|lo-trinh|tai-lieu)\.html|
            (README|AGENTS|MEMORIES|YYSD-DESIGN-RULES)\.md|
            \.github/workflows/(super-linter|quality-gate|deploy-pages)\.yml)$
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          CSS_FILE_NAME: .stylelintrc.json
          HTML_CONFIG_FILE: .htmlhintrc
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          YAML_CONFIG_FILE: .yamllint.yml
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_JSON: true
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_JSCPD: false
