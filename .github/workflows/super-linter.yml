---
name: Super-Linter

on:
  push:
    paths:
      - "vi/**"
      - "tests/**"
      - "docs/vi/**"
      - "*.md"
      - "*.json"
      - "*.js"
      - "*.mjs"
      - ".github/workflows/**"
      - "eslint.config.js"
      - ".stylelintrc.json"
      - ".htmlhintrc"
      - ".markdownlint.json"
      - ".editorconfig"
  pull_request:
    paths:
      - "vi/**"
      - "tests/**"
      - "docs/vi/**"
      - "*.md"
      - "*.json"
      - "*.js"
      - "*.mjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  statuses: write
  pull-requests: write

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint mã nguồn (super-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Super-Linter
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          docker run --rm \
            -e RUN_LOCAL=true \
            -e VALIDATE_ALL_CODEBASE=true \
            -e DEFAULT_BRANCH=main \
            -e IGNORE_GITIGNORED_FILES=true \
            -e FILTER_REGEX_INCLUDE='(^|/)(vi|tests|docs)/' \
            -e VALIDATE_CSS=true \
            -e VALIDATE_HTML=true \
            -e VALIDATE_MARKDOWN=true \
            -e VALIDATE_JSON=true \
            -e VALIDATE_YAML=true \
            -e VALIDATE_GITHUB_ACTIONS=true \
            -e VALIDATE_JAVASCRIPT_ES=false \
            -e VALIDATE_JAVASCRIPT_STANDARD=false \
            -e VALIDATE_JAVASCRIPT_PRETTIER=false \
            -e VALIDATE_CSS_PRETTIER=false \
            -e VALIDATE_HTML_PRETTIER=false \
            -e VALIDATE_JSON_PRETTIER=false \
            -e VALIDATE_MARKDOWN_PRETTIER=false \
            -e VALIDATE_YAML_PRETTIER=false \
            -e VALIDATE_NATURAL_LANGUAGE=false \
            -e VALIDATE_GITLEAKS=false \
            -e VALIDATE_EDITORCONFIG=false \
            -e VALIDATE_CHECKOV=false \
            -e VALIDATE_TRIVY=false \
            -e VALIDATE_JSCPD=false \
            -v "$PWD":/tmp/lint \
            ghcr.io/super-linter/super-linter:v7.4.0 \
            2>&1 | tee /tmp/super-linter.log

      - name: Đăng nhật ký lint
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body=/tmp/sl-body.md
          {
            echo "### Nhật ký Super-Linter"
            echo ""
            echo '```text'
            tail -n 80 /tmp/super-linter.log || echo "không có nhật ký"
            echo '```'
          } > "${body}"
          number=$(jq -r '.pull_request.number // empty' "${GITHUB_EVENT_PATH}")
          if [ -n "${number}" ]; then
            gh pr comment "${number}" --body-file "${body}"
          fi

      - name: Lưu kết quả lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-linter-output
          path: super-linter-output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Kết luận
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Super-Linter phát hiện lỗi."
          exit 1
