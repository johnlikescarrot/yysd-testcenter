name: Super-Linter

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  super-linter:
    name: Kiểm tra mã nguồn với GitHub Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn tối ưu
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/**
            /tests/**
            /assets/css/duo-ielts.css
            /assets/js/duo-app.js
            /assets/js/tai-lieu.js
            /assets/js/duo-hud.js
            /scripts/check_vietnamese.mjs
            /scripts/build_pages.mjs
            /scripts/serve_static.mjs
            /scripts/build_scholar_pdfs.py
            /index.html
            /lo-trinh.html
            /tai-lieu.html
            /vocab.html
            /README.md
            /AGENTS.md
            /MEMORIES.md
            /YYSD-DESIGN-RULES.md
            /.github/workflows/super-linter.yml
            /.github/workflows/quality-gate.yml
            /.github/workflows/deploy-pages.yml
            /.eslintrc.yml
            /.stylelintrc.json
            /.htmlhintrc
            /.markdownlint.json
            /.yamllint.yml

      - name: Chạy GitHub Super-Linter v7
        uses: super-linter/super-linter/slim@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          MULTI_STATUS: true
          LINTER_RULES_PATH: .
          JAVASCRIPT_ES_CONFIG_FILE: .eslintrc.yml
          CSS_FILE_NAME: .stylelintrc.json
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          YAML_CONFIG_FILE: .yamllint.yml
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_PYTHON_RUFF: true
