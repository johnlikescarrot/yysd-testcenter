name: Super-Linter

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  super-linter:
    name: Kiểm tra mã nguồn với GitHub Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt gói phụ thuộc cho ESLint
        run: npm ci

      - name: Chạy GitHub Super-Linter v7
        uses: super-linter/super-linter/slim@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          MULTI_STATUS: true
          LINTER_RULES_PATH: .
          # yamllint disable-line rule:line-length
          FILTER_REGEX_INCLUDE: "^/github/workspace/(src/.*\\.js|tests/.*\\.js|assets/css/duo-ielts\\.css|assets/js/(duo-app|tai-lieu|duo-hud)\\.js|scripts/(check_vietnamese|build_pages|serve_static)\\.mjs|scripts/build_scholar_pdfs\\.py|(index|lo-trinh|tai-lieu|vocab)\\.html|(README|AGENTS|MEMORIES|YYSD-DESIGN-RULES)\\.md|\\.github/workflows/(super-linter|quality-gate|deploy-pages)\\.yml)$"
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          CSS_FILE_NAME: .stylelintrc.json
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          YAML_CONFIG_FILE: .yamllint.yml
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_PYTHON_RUFF: true
