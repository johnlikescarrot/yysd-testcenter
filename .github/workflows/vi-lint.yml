name: IELTS Việt · super-linter

on:
  push:
    branches: [main]
    paths:
      - 'vi/**'
      - 'scripts/vi/**'
      - '.github/**'
  pull_request:
    paths:
      - 'vi/**'
      - 'scripts/vi/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vi-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Chạy super-linter cho ứng dụng mới
        id: superlinter
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -e RUN_LOCAL=true \
            -e DEFAULT_BRANCH=main \
            -e VALIDATE_ALL_CODEBASE=false \
            -e FILTER_REGEX_INCLUDE='(^vi/|^scripts/vi/|^\.github/)' \
            -e FILTER_REGEX_EXCLUDE='(vi/node_modules/|vi/library/|\.git/)' \
            -e VALIDATE_JSON=true \
            -e VALIDATE_YAML=true \
            -e VALIDATE_MARKDOWN=true \
            -e VALIDATE_PYTHON_FLAKE8=true \
            -e PYTHON_FLAKE8_CONFIG_FILE=.flake8 \
            -e MARKDOWN_CONFIG_FILE=.markdownlint.json \
            -e YAML_CONFIG_FILE=.yaml-lint.yml \
            -v "${{ github.workspace }}:/tmp/lint" \
            ghcr.io/super-linter/super-linter:v7.1.0 2>&1 | tee super-linter.log

      - name: Lưu nhật ký super-linter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-linter-log
          path: super-linter.log
          if-no-files-found: ignore

      - name: Báo lỗi nếu super-linter không đạt
        if: steps.superlinter.outcome == 'failure'
        run: |
          echo "Super-Linter phát hiện vấn đề — xem artefact super-linter-log."
          exit 1
