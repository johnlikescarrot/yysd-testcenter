name: Super-Linter · IELTS
on:
  push:
    paths: &paths
      - "*.html"
      - "assets/js/**"
      - "package*.json"
      - "library/mock/cambridge-*/**"
      - "library/mock/ielts/**"
      - "library/practice/ielts/**"
      - ".github/linters/.htmlhintrc"
      - "studio/**"
      - "tests/studio/**"
      - "scripts/studio/**"
      - ".github/workflows/studio-*.yml"
      - "README.md"
  pull_request:
    paths: *paths
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lint-ielts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /atlas*.html
            /README.md
            /package*.json
            /studio/
            /tests/studio/
            /scripts/studio/
            /.github/workflows/studio-*.yml
            /.github/linters/.htmlhintrc
            /library/mock/cambridge-*/*.html
            /library/mock/ielts/*.html
            /library/practice/ielts/*.html
          persist-credentials: false
      - uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MULTI_STATUS: false
          CREATE_LOG_FILE: true
          VALIDATE_ALL_CODEBASE: true
          USE_FIND_ALGORITHM: true
          FILTER_REGEX_INCLUDE: (^|/)(studio/|tests/studio/|scripts/studio/|\.github/workflows/studio-|library/(mock/(cambridge-[^/]+|ielts)|practice/ielts)/[^/]+\.html$|atlas[^/]*\.html$|package(-lock)?\.json$|README\.md$)
          VALIDATE_HTML: true
          VALIDATE_JAVASCRIPT_PRETTIER: true
          VALIDATE_CSS_PRETTIER: true
          VALIDATE_JSON_PRETTIER: true
          VALIDATE_YAML_PRETTIER: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_PYTHON_RUFF: true
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
      - name: Read the container-owned diagnostic log
        if: failure()
        run: sudo chmod a+r super-linter.log
      - name: Annotate actionable lint failures on the check
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import re
          log = Path('super-linter.log')
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              errors = [i for i, line in enumerate(lines) if '[ERROR]' in line]
              for i in errors[:12]:
                  msg = re.sub(r'\x1b\[[;?\d]*[a-zA-Z]', '', ' '.join(lines[max(0, i-3):i+3]))
                  print('::error title=Super-Linter::' + msg.replace('%', '%25')[:1800])
