name: Triển Khai GitHub Pages

on:
  push:
    branches:
      - main
      - "arena/3cddb9e1-yysd-testcenter"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Đóng gói ứng dụng IELTS tĩnh (_site)
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Tạo gói triển khai tối ưu _site/
        run: node scripts/build_pages.mjs

      - name: Tải gói _site/ lên GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Xuất bản lên GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
