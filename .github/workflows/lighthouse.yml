name: Lighthouse 100
on:
  push:
    branches:
      - arena/977f1811-yysd-testcenter
      - main
    paths:
      - docs/**
      - .lighthouserc.json
      - .github/workflows/lighthouse.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cai Lighthouse CI
        run: npm install --global @lhci/cli@0.15.1
      - name: Kiem tra 100/100 o ca bon hang muc
        run: lhci autorun --config=.lighthouserc.json
