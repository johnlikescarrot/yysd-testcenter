name: Trien khai GitHub Pages
on:
  push:
    branches:
      - arena/977f1811-yysd-testcenter
      - main
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cau hinh Pages
        uses: actions/configure-pages@v5
      - name: Dong goi trang tinh
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Trien khai
        id: deployment
        uses: actions/deploy-pages@v4
