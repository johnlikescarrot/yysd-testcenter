name: Trien khai GitHub Pages
on:
  push:
    branches:
      - arena/977f1811-yysd-testcenter
      - main
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-ielts-viet
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Kiem tra Pages da duoc bat
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages chua duoc bat. Hay mo Settings > Pages > Build and deployment > GitHub Actions mot lan; workflow se tu dong trien khai o lan chay tiep theo."
          fi
      - name: Cau hinh Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Dong goi trang tinh
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Trien khai
        if: steps.pages_check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
