name: IELTS Việt · Lighthouse 100

on:
  push:
    branches: [main]
    paths:
      - 'vi/**'
      - '.lighthouserc.json'
      - '.github/workflows/vi-lighthouse.yml'
  pull_request:
    paths:
      - 'vi/**'
      - '.lighthouserc.json'
      - '.github/workflows/vi-lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vi-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Đo 4 hạng mục
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Chạy Lighthouse CI
        id: lhci
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes @lhci/cli@0.14.x autorun 2>&1 | tee lhci.log

      - name: Đăng kết quả chi tiết vào PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '<details><summary>Nhật ký Lighthouse CI</summary>'
            echo
            echo '```'
            tail -c 6000 lhci.log
            echo '```'
            echo '</details>'
          } > lhci-report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file lhci-report.md

      - name: Thất bại nếu chưa đạt 100 điểm
        if: steps.lhci.outcome == 'failure'
        run: |
          echo 'Lighthouse CI không đạt ngưỡng 100 — xem bình luận trong PR.'
          exit 1
