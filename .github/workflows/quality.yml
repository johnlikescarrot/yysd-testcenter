name: Chất lượng (coverage + Lighthouse)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit test & coverage 100%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ielts/package-lock.json
      - run: npm ci --prefix ielts
      - run: npm run coverage --prefix ielts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/i18n/check.py

  lighthouse:
    name: Lighthouse 100/100
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 ielts/scripts/build_pages.py
      - name: Lighthouse CI
        run: npx --no-install lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ""
