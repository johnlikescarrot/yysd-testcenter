name: Rebuild content list

# Whenever a content HTML file is added, changed, or removed in the library/
# folder, regenerate library/manifest.json automatically and commit it back.
# This lets the admin add content just by uploading files — no code needed.

on:
  push:
    paths:
      - "library/**"
      - "app/library/toefl/**/*.json"
      - "app/assets/js/hit-shell.js"
      - "assets/js/config.js"
      - "assets/js/exam*.js"
      - "assets/js/zone.js"
      - "assets/js/vocab-*.js"
      - "scripts/check_cdt_p1.js"
      - "scripts/check_vocab_lesson.js"
      - "scripts/localize_toefl_labels.py"
      - "scripts/audit_vietnamese.py"
      - "scripts/locales/toefl-vi.json"
      - "scripts/toefl_lab_i18n.js"
      - "scripts/build_toefl_lab_index.js"
      - "scripts/check_hit_swiss.js"
      - "scripts/build_manifest.py"
      - "scripts/*cambridge*.py"
      - "scripts/cambridge_sources/**"
      - "scripts/verify_vocab_wrongword_hooks.py"
      - "scripts/check_cet4_lite.js"
      - ".github/workflows/build-manifest.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so "added" dates resolve correctly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Report remaining localization scope (informational)
        run: python scripts/audit_vietnamese.py >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Cambridge mock pages
        run: python scripts/verify_cambridge_mock_pages.py

      - name: Rebuild the portable Cambridge sources in a temporary directory
        run: python scripts/verify_cambridge_sources.py

      - name: Verify CDT and vocabulary routes
        run: |
          node scripts/check_cdt_p1.js
          node scripts/check_vocab_lesson.js

      - name: Verify vocab wrong-word hooks
        run: python scripts/verify_vocab_wrongword_hooks.py

      - name: Verify both TOEFL banks and the Vietnamese catalog
        run: |
          python scripts/localize_toefl_labels.py
          node scripts/build_toefl_lab_index.js
          git diff --exit-code -- library/toefl/lab-index.json
          node scripts/check_toefl_paper.js
          node scripts/check_toefl_lab.js
          node scripts/check_hit_swiss.js

      - name: Rebuild manifest
        run: python scripts/build_manifest.py

      - name: Verify cet4-lite still indexed
        run: node scripts/check_cet4_lite.js

      - name: Commit updated manifest
        run: |
          git config user.name  "yysd-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- library/manifest.json; then
            echo "manifest.json unchanged — nothing to commit."
          else
            git add library/manifest.json
            git commit -m "chore: rebuild content manifest [skip ci]"
            git push
          fi
