name: Super-Linter · IELTS tiếng Việt
on:
  pull_request:
  push:
    branches: [main, 'arena/5b49db07-yysd-testcenter']
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'
permissions:
  contents: read
concurrency:
  group: path-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            ielts-vi
      - name: Check the learning workspace and its workflows
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          USE_FIND_ALGORITHM: true
          MULTI_STATUS: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          CREATE_LOG_FILE: true
          VALIDATE_ALL_CODEBASE: true
          FILTER_REGEX_INCLUDE: '(^|/)(ielts-vi/|\.github/workflows/learning-path-)'
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JAVASCRIPT_PRETTIER: true
          VALIDATE_JSON: true
          VALIDATE_CSS_PRETTIER: true
          VALIDATE_PYTHON_RUFF: true
      - name: Show lint diagnostics
        if: failure()
        run: |
          if test -f super-linter.log; then
            grep -Ei 'error|fatal|failed' super-linter.log | tail -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
