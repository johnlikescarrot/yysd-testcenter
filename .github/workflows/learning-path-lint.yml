name: Super-Linter · IELTS tiếng Việt
on:
  pull_request:
  push:
    branches: [main, 'arena/5b49db07-yysd-testcenter']
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'
permissions:
  contents: read
concurrency:
  group: path-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            ielts-vi
      - name: Super-Linter (official slim image)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/tmp/lint:ro" \
            --env-file ielts-vi/tools/super-linter.env \
            ghcr.io/super-linter/super-linter:slim-v9.0.0 2>&1 | tee "$RUNNER_TEMP/super-linter.log"
      - name: Surface lint diagnostics
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/super-linter.log"; then
            tail -20 "$RUNNER_TEMP/super-linter.log" | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
