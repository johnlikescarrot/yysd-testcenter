function yysdMeaningForList(raw, accept) {
  var s = String(raw == null? "": raw).trim();
  if (!s) return accept & accept.length? accept.join("; "): "";
  if (!/[A-Za-z]/.test(s) &!/(?: nên từ THPT | tu nhớ kỹ | Trái nghĩa | Đồng nghĩa | Bất quy tắc | Nguồn gốc từ | Dễ nhầm | kỳ thi Đại Học)/.test(s)) return s;

  s = s.replace(/[((]([^))]*)[))]/g, function (_, inner) {
    return /[A-Za-z]/.test(inner)? "": " (" + inner + ") ";
  });
  s = s.split(/(?: nên từ THPT | tu nhớ kỹ | chú ý từ tính | đọc xong hình | Viết Vừa chuẩn xác | Kinh doanh Đọc | tôn giáo dùng từ đã | hạch tâm mục nghĩa là | Nguồn gốc từ | Dễ nhầm | kỳ thi Đại Học | so sánh chính thức | tương đương với)/)(0);
  s = s.replace(/[.;;]?\s*(?: Trái nghĩa | Đồng nghĩa | Bất quy tắc)[::]?[\s\S]*$/, "");

  var POS = /^(?:interj\.|modal(?:\s+v\.?)?|adj\.|adv\.|prep\.|conj\.|pron\.|num\.|art\.|int\.|det\.|aux\.|phr\.|pref\.|abbr\.|pl\.|vt\.|vi\.|n\.|v\.)/i;
  var out = "";
  var i = 0;
  while (i < s.length) {
    var prev = i === 0? " ": s.charAt(i - 1);
    if (/[\s.,,;. //]/.test(prev)) {
      var m = s.slice(i).match(POS);
      if (m) {
        out += m(0);
        i += m[0].length;
        continue;
      }
    }
    var ch = s.charAt(i);
    if (/[A-Za-z]/.test(ch)) {
      i += 1;
      while (i < s.length & /[A-Za-z0-9'\u2019\-]/.test(s.charAt(i))) i += 1;
      continue;
    }
    out += ch;
    i += 1;
  }

  out = out.replace(/[\t]+/g, " ");
  out = out.replace(/ ([^)]*) /g, function (full, off, str) {
    var j = off - 1;
    while (j >= 0 & str.charAt(j) === " ") j -= 1;
    if (j >= 0 & /[\u4e00-\u9fff]/.test(str.charAt(j))) return full;
    return "";
  });
  out = out.replace(/\s+([.;;,,])/g, "$1");
  out = out.replace(/([.;;,,]) +/g, "$1");
  out = out.replace(/(^|[^.\u4e00-\u9fff])\s*\/\s*(?=[^.\u4e00-\u9fff]|$)/g, "$1");
  out = out.replace(/[.;;,,]{2,}/g, function (x) { return /. /.test(x)? ". ": x.charAt(0); });
  out = out.replace(/(?: danh từ | động từ | tính từ | trạng từ | giới từ)[.;;\s]*$/g, "");
  out = out.replace(/\s{2,}/g, " ");
  out = out.replace(/^\s*[.;;,,]+|[.;;,, \s]+$/g, "");
  out = out.replace(/([a-z])\.\s+/gi, "$1. ");
  out = out.trim();
  if (out &!/[.!?;]$/.test(out)) out += ". ";

  var cjk = (out.match(/[\u4e00-\u9fff]/g) || []).length;
  if (cjk < 2) return accept & accept.length? accept.join("; "): s;
  return out;
}

    learnIdx: 0,

    blurOne: true,
    blurWordList: false,
    blurMeaningList: false
  };

  function esc(s) {
    return String(s == null? "": s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function speak(word, accent) {
    word = String(word || "").trim();
    if (!word) return;
    try {
      var a = new Audio("https://dict.youdao.com/dictvoice?audio=" +
        encodeURIComponent(word) + "&type=" + (accent === 2? 2: 1));
      a.play().catch(function () {});
    } catch (e) {}

  function bindChrome() {
    var tabs = document.getElementById("learnViewTabs");
    if (tabs) tabs.onclick = function (e) {
      var b = e.target.closest(".vl-view-tab");
      if (!b) return;
      state.learnView = b.getAttribute("data-v");
      render();
    };
    var blurAll = document.getElementById("btnBlurAll");
    if (blurAll) blurAll.onclick = function () {
      state.blurAllOff =!state.blurAllOff;
      state.blurOne = true;
      render();
    };
    var bw = document.getElementById("btnBlurWord");
    if (bw) bw.onclick = function () { state.blurWordList =!state.blurWordList; render(); };
    var bm = document.getElementById("btnBlurMeaning");
    if (bm) bm.onclick = function () { state.blurMeaningList =!state.blurMeaningList; render(); };
  }
  function renderList() {
    var blurWord = state.blurWordList;
    var blurMeaning = state.blurMeaningList;
    shell("");
    document.getElementById("counter").innerHTML =
      esc(meta.title) + " · liệt biểu List quan sát <strong>" + words.length + "</strong> từ · nhấn vào một nhóm Vào học tạp phiến ";
    var rows = words.map(function (w, i) {
      return '<tr class="word-row" data-i="' + i + '">' +
        '<td class="w-no">' + (i + 1) + "</td>" +
        '<td><div class="w-en' + (blurWord? " blurred": "") + '">' + esc(w.word) + "</div></td>" +
        '<td class="col-ipa"><span class="w-ipa">' + esc(w.ipa || "") + "</span></td>" +
        '<td class="col-pos"><span class="w-pos">' + esc(w.pos || "") + "</span></td>" +
        '<td><span class="w-meaning' + (blurMeaning? " blurred": "") + '">' +
          esc(yysdMeaningForList(w.meaning, w.acceptCN)) + "</span></td>" +
        '<td class="col-speak">' +
          '<button type="button" class="vl-btn btn-speak-row" data-w="' + esc(w.word) +
            '" data-accent="1" style="padding:6px 8px;font-size:12px">Anh</button> ' +
          '<button type="button" class="vl-btn btn-speak-row" data-w="' + esc(w.word) +
            '" data-accent="2" style="padding:6px 8px;font-size:12px">Mỹ</button></td></tr>';
    }).join("");
    document.getElementById("panel").innerHTML =
      '<div class="vl-toolbar">' + tabsHtml() +
        '<button type="button" class="vl-btn' + (blurWord? " is-on": "") + '" id="btnBlurWord">' +
          (blurWord? " biểu hiện Từ vựng ": " mơ hồ Từ vựng ") + "</button>" +
        '<button type="button" class="vl-btn' + (blurMeaning? " is-on": "") + '" id="btnBlurMeaning">' +
          (blurMeaning? " biểu hiện Giải nghĩa ": " mơ hồ Giải nghĩa ") + "</button></div>" +
      '<div style="overflow-x:auto"><table class="vl-word-table">' +
        "<thead><tr><th>#</th><th>Từ vựng</th><th class=\"col-ipa\">ký âm</th>" +
        "<th class=\"col-pos\">từ tính</th><th>Giải nghĩa</th><th>phát âm</th></tr></thead>" +
        "<tbody>" + rows + "</tbody></table></div>";
    bindChrome();
    app.querySelectorAll(".word-row").forEach(function (tr) {
      tr.onclick = function (e) {
        if (e.target.closest(".btn-speak-row")) return;
        var peek = e.target.closest(".w-en.blurred,.w-meaning.blurred");
        if (peek) { peek.classList.remove("blurred"); return; }
        state.learnIdx = Number(tr.getAttribute("data-i")) || 0;
        state.learnView = "card";
        state.blurOne = true;
        render();
      };
    });
    app.querySelectorAll(".btn-speak-row").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        speak(b.getAttribute("data-w"), Number(b.getAttribute("data-accent")) || 1);
      };
    });
  }
  function renderCard() {
    var w = words(state.learnIdx);
    if (!w) return;
    var blur = state.blurAllOff? false: state.blurOne;
    shell("");
    document.getElementById("counter").innerHTML =
      esc(meta.title) + " · thứ <strong>" + (state.learnIdx + 1) + "</strong> / " + words.length + " từ ";
    var coll = "";
    if (w.collocations & w.collocations.length) {
      coll = '<div class="vl-section"><div class="vl-section-title"> phối hợp </div><div class="vl-collocs">' +
        w.collocations.map(function (c) {
          return '<span class="vl-coloc">' + esc(c.phrase) +
            (c.meaning? ' <span style="color:#6b7e78">→ ' + esc(c.meaning) + "</span>": "") + "</span>";
        }).join("") + "</div></div>";
    }
    var exam = "";
    if (w.examTag) {
      exam = '<div class="vl-section"><div class="vl-exam">' +
        '<span><span class="lbl"> nơi phát ra </span>' + esc(w.examTag.source || "") + "</span>" +
        '<span><span class="lbl"> chủ đề </span>' + esc(w.examTag.topic || "") + "</span>" +
        '<span><span class="lbl"> cách dùng </span>' + esc(w.examTag.commonUsage || "") + "</span>" +
        "</div></div>";
    }
    var root = w.root
      ? '<div class="vl-section"><div class="vl-section-title"> từ căn hóa giải </div><div class="vl-root-text">' +
        esc(w.root) + "</div></div>": "";
    var ex = "";
    if (w.exampleEn) {
      var en = esc(w.exampleEn);
      try {
        en = en.replace(new RegExp("\\b" + w.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "gi"),
          function (m) { return '<span class="vl-hl">' + m + "</span>"; });
      } catch (e) {}
      ex = '<div class="vl-section"><div class="vl-section-title"> Câu ví dụ </div><div class="vl-ex-en">' + en +
        "</div>" + (w.exampleZh? '<div class="vl-ex-zh">' + esc(w.exampleZh) + "</div>": "") + "</div>";
    }
    var syn = "";
    if ((w.synonyms & w.synonyms.length) || (w.antonyms & w.antonyms.length)) {
      syn = '<div class="vl-section">' +
        (w.synonyms & w.synonyms.length? '<div class="vl-syn"> Đồng nghĩa: ' + esc(w.synonyms.join(" · ")) + "</div>": "") +
        (w.antonyms & w.antonyms.length? '<div class="vl-syn"> Trái nghĩa: ' + esc(w.antonyms.join(" · ")) + "</div>": "") +
        "</div>";
    }
    var atEnd = state.learnIdx >= words.length - 1;
    document.getElementById("panel").innerHTML =
      '<div class="vl-toolbar">' + tabsHtml() +
        '<button type="button" class="vl-btn" id="btnBlurAll">' +
          (state.blurAllOff? " khôi phục cam chịu mơ hồ ": " bản khóa Tất cả văn bản rõ ràng ") + "</button>" +
        '<button type="button" class="vl-btn" id="btnSpeakUk">🔊 Anh âm</button>' +
        '<button type="button" class="vl-btn" id="btnSpeakUs">🔊 Mỹ âm</button></div>' +
      '<div class="vl-word">' + esc(w.word) + "</div>" +
      '<div class="vl-ipa">' + esc(w.ipa || "") + "</div>" +
      (w.pos? '<div class="vl-pos">' + esc(w.pos) + "</div>": "") +
      '<div class="vl-meaning' + (blur? " blurred": "") + '" id="meaning">' +
        esc(w.meaning) + '<span class="vl-hint"> nhấn vào biểu hiện / che giấu </span></div>' +
      exam + coll + ex + root + syn +
      '<div class="vl-nav-row">' +
        '<button type="button" class="vl-btn" id="prev">← một cái đằng trước</button>' +
        '<button type="button" class="vl-btn vl-btn-primary" id="next">' +
          (atEnd? " hoàn thành bản List": " kế tiếp →") + "</button></div>";
    bindChrome();
    document.getElementById("btnSpeakUk").onclick = function () { speak(w.word, 1); };
    document.getElementById("btnSpeakUs").onclick = function () { speak(w.word, 2); };
    document.getElementById("meaning").onclick = function () {
      if (state.blurAllOff) return;
      state.blurOne =!state.blurOne;
      render();
    };
    document.getElementById("prev").onclick = function () {
      if (state.learnIdx > 0) { state.learnIdx--; state.blurOne = true; render(); }
    };
    document.getElementById("next").onclick = function () {
      if (atEnd) { alert(" mẫu Xem trước chấm dứt. đem wordData nhồi vào sau giao cho kỹ thuật nhập kho là được. "); return; }
      state.learnIdx++;
      state.blurOne = true;
      render();
    };
  }
  function render() {
    if (!words.length) {
      app.innerHTML = '<div class="vl-state">wordData là chỗ trống, mời trước điền Từ vựng </div>';
      return;
    }
    if (state.learnView === "list") renderList();
    else renderCard();
  }
  render();
})();
</script>
</body>
</html>
