<style>
/* ==========================================================================
   YYSD · IELTS Việt — design system
   Kế thừa ngôn ngữ thị giác của YYSD: nội dung như giấy, vỏ như kính,
   tương tác như vật lý. Không webfont, không ảnh raster → tải tức thì.
   ========================================================================== */

:root {
  color-scheme: light;

  --paper: #fffcf7;
  --canvas: #f6f3ec;
  --canvas-deep: #efe9dc;
  --navy: #07192f;
  --navy-soft: #102a4c;
  --ink: #101827;
  --ink-muted: #55606f;
  --ink-faint: #615c4e;
  --gold: #c7a45d;
  --gold-dark: #7d6024;
  --gold-ink: #72541a;
  --gold-soft: #f6eedf;
  --line: #e5ddcd;
  --line-strong: #d5c6ae;

  --ok: #1f6b4c;
  --ok-soft: #e6f2ec;
  --bad: #a33127;
  --bad-soft: #fbe9e6;
  --info: #1f4d7a;
  --info-soft: #e8eff7;

  --radius-xl: 24px;
  --radius-lg: 18px;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-pill: 999px;

  --shadow-xs: 0 1px 2px rgba(7, 25, 47, .05);
  --shadow-sm: 0 1px 2px rgba(7, 25, 47, .05), 0 6px 16px -12px rgba(7, 25, 47, .18);
  --shadow-md: 0 16px 40px -24px rgba(7, 25, 47, .3);
  --shadow-lg: 0 32px 70px -32px rgba(7, 25, 47, .36);

  --ease: cubic-bezier(.4, 0, .2, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --fast: 160ms;
  --base: 280ms;

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    "Noto Sans", Arial, sans-serif;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
    Georgia, "Times New Roman", serif;

  --chrome-bg: rgba(255, 252, 247, .82);
  --chrome-edge: rgba(255, 255, 255, .7);
  --chrome-blur: 18px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background-color: var(--canvas);
  background-image: radial-gradient(circle at 12% -10%, #fffdf8 0%, transparent 46%),
    radial-gradient(circle at 96% 0%, #fbf3e3 0%, transparent 38%);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1,
h2,
h3,
h4 {
  margin: 0 0 .35em;
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.15;
  color: var(--navy);
}

h1 {
  font-size: clamp(1.7rem, 1.3rem + 1.6vw, 2.5rem);
}

h2 {
  font-size: clamp(1.3rem, 1.1rem + .7vw, 1.65rem);
}

h3 {
  font-size: 1.12rem;
}

p {
  margin: 0 0 .9em;
}

a {
  color: var(--navy-soft);
  text-decoration-color: var(--gold);
  text-underline-offset: 3px;
}

a:hover {
  color: var(--gold-ink);
}

strong {
  font-weight: 650;
}

ul,
ol {
  margin: 0 0 1em;
  padding-inline-start: 1.2em;
}

li + li {
  margin-top: .3em;
}

button {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--gold-dark);
  outline-offset: 2px;
  border-radius: 6px;
}

::selection {
  background: var(--gold-soft);
  color: var(--navy);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: 50%;
  top: -4rem;
  z-index: 90;
  transform: translateX(-50%);
  padding: .7rem 1.2rem;
  border-radius: 0 0 var(--radius) var(--radius);
  background: var(--navy);
  color: #fff;
  font-weight: 600;
  text-decoration: none;
  transition: top var(--fast) var(--ease);
}

.skip-link:focus {
  top: 0;
  color: #fff;
}

/* ---------- Shell ---------- */

.app {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 100dvh;
}

.main {
  min-width: 0;
  padding: 1.1rem clamp(.9rem, 3vw, 2.6rem) 6.5rem;
}

.shell-wrap {
  width: min(1120px, 100%);
  margin-inline: auto;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: .75rem;
  flex-wrap: wrap;
  padding: .7rem clamp(.9rem, 3vw, 2.6rem);
  background: var(--chrome-bg);
  backdrop-filter: blur(var(--chrome-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--chrome-blur)) saturate(180%);
  border-bottom: 1px solid var(--line);
}

@supports not (backdrop-filter: blur(2px)) {
  .topbar {
    background: #fffdf8;
  }
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: .6rem;
  text-decoration: none;
  color: var(--navy);
  margin-inline-end: auto;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 13px;
  background: linear-gradient(150deg, var(--navy) 0%, var(--navy-soft) 100%);
  color: var(--gold);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 1.06rem;
  font-weight: 650;
  letter-spacing: -.01em;
}

.brand-sub {
  font-size: .7rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.stats {
  display: flex;
  align-items: center;
  gap: .4rem;
  flex-wrap: wrap;
}

.stat {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  min-height: 34px;
  padding: .22rem .7rem .22rem .55rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: #fffdf8;
  font-size: .86rem;
  font-weight: 650;
  color: var(--navy);
  white-space: nowrap;
}

.stat svg {
  width: 18px;
  height: 18px;
  flex: none;
}

.stat--streak svg {
  color: #a83f1b;
}

.stat--xp svg {
  color: var(--gold-dark);
}

.stat--gem svg {
  color: #19607a;
}

.stat--heart svg {
  color: #a33127;
}

.stat-meta {
  font-size: .7rem;
  font-weight: 600;
  color: var(--ink-muted);
}

.nav-desktop {
  display: none;
}

.nav-list {
  display: flex;
  gap: .15rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  min-height: 42px;
  padding: .35rem .8rem;
  border-radius: var(--radius-pill);
  color: var(--ink-muted);
  font-size: .92rem;
  font-weight: 600;
  text-decoration: none;
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
}

.nav-link svg {
  width: 19px;
  height: 19px;
}

.nav-link:hover {
  background: #fff;
  color: var(--navy);
}

.nav-link[aria-current="page"] {
  background: var(--gold-soft);
  color: var(--gold-ink);
}

.bottom-nav {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 45;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: .1rem;
  padding: .35rem .4rem calc(.35rem + env(safe-area-inset-bottom));
  background: var(--chrome-bg);
  backdrop-filter: blur(var(--chrome-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--chrome-blur)) saturate(180%);
  border-top: 1px solid var(--line);
}

.bottom-nav a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .15rem;
  padding: .35rem .2rem;
  border-radius: var(--radius-sm);
  font-size: .68rem;
  font-weight: 650;
  color: var(--ink-muted);
  text-decoration: none;
  min-height: 52px;
  justify-content: center;
}

.bottom-nav svg {
  width: 22px;
  height: 22px;
}

.bottom-nav a[aria-current="page"] {
  color: var(--gold-ink);
  background: var(--gold-soft);
}

@media (min-width: 960px) {
  .app {
    grid-template-columns: 248px 1fr;
  }

  .topbar {
    grid-column: 1 / -1;
  }

  .main {
    grid-column: 1 / -1;
    padding-bottom: 2.6rem;
  }

  .nav-desktop {
    display: flex;
    order: -1;
  }

  .bottom-nav {
    display: none;
  }
}

/* ---------- Primitives ---------- */

.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-sm);
  padding: clamp(1rem, 2.2vw, 1.45rem);
}

.card--flat {
  box-shadow: none;
}

.card--navy {
  background: linear-gradient(160deg, #0a2038 0%, #07192f 68%, #04101f 100%);
  border-color: #0d2b49;
  color: #f3ecdd;
}

.card--navy h2,
.card--navy h3 {
  color: #fff8e8;
}

.card--navy p {
  color: #ddd0b4;
}

.stack {
  display: grid;
  gap: 1rem;
}

.stack-sm {
  display: grid;
  gap: .5rem;
}

.row {
  display: flex;
  align-items: center;
  gap: .6rem;
  flex-wrap: wrap;
}

.row--between {
  justify-content: space-between;
}

.row--tight {
  gap: .35rem;
}

.grow {
  flex: 1 1 12rem;
}

.muted {
  color: var(--ink-muted);
}

.faint {
  color: var(--ink-faint);
}

.small {
  font-size: .85rem;
}

.tiny {
  font-size: .75rem;
}

.center {
  text-align: center;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  margin: 0 0 .5rem;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--gold-ink);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .18rem .6rem;
  border-radius: var(--radius-pill);
  background: var(--gold-soft);
  color: var(--gold-ink);
  font-size: .75rem;
  font-weight: 700;
}

.pill--ok {
  background: var(--ok-soft);
  color: var(--ok);
}

.pill--info {
  background: var(--info-soft);
  color: var(--info);
}

.pill--muted {
  background: #f1ece1;
  color: #645f52;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  min-height: 46px;
  padding: .62rem 1.15rem;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: var(--gold);
  color: #21180a;
  font-size: .95rem;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: transform 90ms var(--ease), box-shadow var(--fast) var(--ease),
    background var(--fast) var(--ease);
  box-shadow: 0 3px 0 #a98234, var(--shadow-xs);
}

.btn:hover {
  background: #d3b273;
}

.btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #a98234;
}

.btn--primary {
  background: var(--navy);
  color: #fff8e8;
  box-shadow: 0 3px 0 #04101f, var(--shadow-xs);
}

.btn--primary:hover {
  background: var(--navy-soft);
}

.btn--primary:active {
  box-shadow: 0 1px 0 #04101f;
}

.btn--ghost {
  background: transparent;
  border-color: var(--line-strong);
  color: var(--navy);
  box-shadow: none;
}

.btn--ghost:hover {
  background: #fff;
}

.btn--ghost:active {
  transform: translateY(1px);
  box-shadow: none;
}

.btn--quiet {
  background: transparent;
  border-color: transparent;
  color: var(--ink-muted);
  box-shadow: none;
  min-height: 38px;
  padding: .35rem .6rem;
}

.btn--quiet:hover {
  background: #f2ecdf;
  color: var(--navy);
}

.btn--sm {
  min-height: 38px;
  padding: .35rem .8rem;
  font-size: .85rem;
}

.btn--block {
  width: 100%;
}

.btn[aria-disabled="true"],
.btn:disabled {
  opacity: .55;
  cursor: not-allowed;
  transform: none;
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #fffdf8;
  color: var(--navy);
  cursor: pointer;
}

.icon-btn:hover {
  background: #fff;
  border-color: var(--line-strong);
}

.icon-btn svg {
  width: 20px;
  height: 20px;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: .8rem;
  flex-wrap: wrap;
  margin-bottom: .8rem;
}

.section-head h2 {
  margin: 0;
}

.grid {
  display: grid;
  gap: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
}

.grid--2 {
  grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr));
}

/* ---------- Trang chủ ---------- */

.hero {
  display: grid;
  gap: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
  align-items: stretch;
}

.hero-main {
  position: relative;
  overflow: hidden;
}

.hero-main::after {
  content: "";
  position: absolute;
  inset: auto -30% -60% auto;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(199, 164, 93, .28), transparent 68%);
  pointer-events: none;
}

.hero-actions {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
  margin-top: .4rem;
}

.goal {
  display: grid;
  gap: 1rem;
  align-content: start;
}

.ring {
  position: relative;
  display: grid;
  place-items: center;
  width: 148px;
  height: 148px;
  margin-inline: auto;
}

.ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring-track {
  fill: none;
  stroke: #ece4d5;
  stroke-width: 11;
}

.ring-fill {
  fill: none;
  stroke: var(--gold);
  stroke-width: 11;
  stroke-linecap: round;
  transition: stroke-dashoffset var(--base) var(--ease-out);
}

.ring-text {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  line-height: 1.1;
}

.ring-value {
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 650;
  color: var(--navy);
}

.ring-label {
  font-size: .72rem;
  font-weight: 650;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.quest-list,
.plain-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: .65rem;
}

.quest {
  display: grid;
  grid-template-columns: 38px 1fr auto;
  align-items: center;
  gap: .7rem;
}

.quest-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--gold-soft);
  color: var(--gold-ink);
}

.quest-icon svg {
  width: 20px;
  height: 20px;
}

.quest-title {
  font-size: .92rem;
  font-weight: 650;
  margin: 0;
}

.quest-bar {
  height: 6px;
  margin-top: .35rem;
  border-radius: var(--radius-pill);
  background: #efe8d9;
  overflow: hidden;
}

.quest-bar > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--gold);
}

.quest-done {
  color: var(--ok);
  font-weight: 700;
  font-size: .8rem;
}

/* ---------- Path / units ---------- */

.unit {
  display: grid;
  gap: 1rem;
}

.unit-head {
  display: flex;
  align-items: center;
  gap: .9rem;
  flex-wrap: wrap;
}

.unit-badge {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  flex: none;
  border-radius: 16px;
  background: var(--navy);
  color: var(--gold);
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 650;
}

.unit-badge--locked {
  background: #e9e2d3;
  color: #6a6454;
}

.path {
  position: relative;
  display: grid;
  gap: .85rem;
  padding: .4rem 0 .2rem;
}

.path::before {
  content: "";
  position: absolute;
  inset-block: 18px;
  left: 25px;
  width: 2px;
  background: repeating-linear-gradient(to bottom, var(--line-strong) 0 6px, transparent 6px 12px);
}

.node {
  position: relative;
  display: grid;
  grid-template-columns: 52px 1fr auto;
  align-items: center;
  gap: .85rem;
  padding: .55rem .7rem .55rem .4rem;
  border-radius: var(--radius-lg);
  border: 1px solid transparent;
  text-decoration: none;
  color: inherit;
  background: transparent;
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease);
}

a.node:hover {
  background: #fffdf8;
  border-color: var(--line);
}

.node-dot {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 3px solid var(--line-strong);
  background: var(--paper);
  color: var(--ink-muted);
}

.node-dot svg {
  width: 24px;
  height: 24px;
}

.node--done .node-dot {
  border-color: var(--gold);
  background: var(--gold);
  color: #21180a;
}

.node--current .node-dot {
  border-color: var(--navy);
  background: var(--navy);
  color: #fff8e8;
  box-shadow: 0 0 0 6px rgba(199, 164, 93, .22);
}

.node--locked {
  opacity: .62;
}

.node--locked .node-dot {
  border-color: var(--line);
  background: #efe9dc;
}

.node-title {
  margin: 0;
  font-size: .98rem;
  font-weight: 650;
  color: var(--navy);
}

.node-meta {
  margin: .12rem 0 0;
  font-size: .78rem;
  color: var(--ink-faint);
}

.node-xp {
  font-size: .78rem;
  font-weight: 700;
  color: var(--gold-ink);
  white-space: nowrap;
}

.unit-progress {
  height: 7px;
  border-radius: var(--radius-pill);
  background: #ece4d5;
  overflow: hidden;
  width: min(220px, 40vw);
}

.unit-progress > span {
  display: block;
  height: 100%;
  background: var(--gold);
  border-radius: inherit;
}

/* ---------- Lesson player ---------- */

.lesson-shell {
  display: grid;
  gap: 1rem;
  width: min(760px, 100%);
  margin-inline: auto;
}

.lesson-top {
  display: flex;
  align-items: center;
  gap: .8rem;
}

.lesson-top .icon-btn {
  flex: none;
}

.lesson-progress {
  flex: 1;
  height: 12px;
  border-radius: var(--radius-pill);
  background: #e9e1d1;
  overflow: hidden;
}

.lesson-progress > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold) 0%, #d8b573 100%);
  transition: width var(--base) var(--ease-out);
}

.lesson-count {
  font-size: .8rem;
  font-weight: 700;
  color: var(--ink-muted);
  min-width: 3.2rem;
  text-align: right;
}

.prompt {
  font-size: 1.02rem;
  color: var(--ink-muted);
  margin-bottom: .5rem;
}

.stem {
  font-family: var(--font-display);
  font-size: clamp(1.15rem, 1rem + .6vw, 1.45rem);
  line-height: 1.35;
  color: var(--navy);
  margin: 0 0 1rem;
}

.stem em {
  color: var(--gold-ink);
  font-style: normal;
  font-weight: 650;
}

.blank {
  display: inline-block;
  min-width: 4.5rem;
  padding: 0 .35rem;
  border-bottom: 2px dashed var(--gold-dark);
  text-align: center;
  color: var(--gold-ink);
  font-weight: 650;
}

.options {
  display: grid;
  gap: .65rem;
}

.option {
  display: flex;
  align-items: center;
  gap: .75rem;
  width: 100%;
  min-height: 56px;
  padding: .7rem .95rem;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: .98rem;
  text-align: left;
  cursor: pointer;
  transition: transform 90ms var(--ease), border-color var(--fast) var(--ease),
    background var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}

.option:hover:not(:disabled) {
  border-color: var(--line-strong);
  background: #fff;
}

.option:active:not(:disabled) {
  transform: scale(.995);
}

.option:disabled {
  cursor: default;
}

.option-key {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  flex: none;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: #faf6ec;
  font-size: .78rem;
  font-weight: 700;
  color: var(--ink-muted);
}

.option[aria-pressed="true"] {
  border-color: var(--navy);
  background: #f2f6fb;
}

.option--right {
  border-color: var(--ok);
  background: var(--ok-soft);
}

.option--right .option-key {
  border-color: var(--ok);
  color: var(--ok);
}

.option--wrong {
  border-color: var(--bad);
  background: var(--bad-soft);
}

.option--wrong .option-key {
  border-color: var(--bad);
  color: var(--bad);
}

.answer-line {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
  align-items: center;
}

.text-field {
  flex: 1 1 16rem;
  min-height: 52px;
  padding: .7rem .9rem;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  font-size: 1rem;
  color: var(--ink);
}

.text-field:focus {
  border-color: var(--navy);
  outline: none;
  box-shadow: 0 0 0 3px rgba(16, 42, 76, .14);
}

.bank {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  padding: .9rem;
  border: 2px dashed var(--line-strong);
  border-radius: var(--radius);
  background: #fdfaf2;
  min-height: 64px;
}

.chip {
  min-height: 42px;
  padding: .35rem .8rem;
  border: 1px solid var(--line-strong);
  border-bottom-width: 3px;
  border-radius: var(--radius-sm);
  background: #fff;
  font-size: .95rem;
  font-weight: 600;
  color: var(--navy);
  cursor: pointer;
}

.chip:hover {
  background: #fffdf6;
  border-color: var(--gold-dark);
}

.chip--used {
  opacity: .35;
  pointer-events: none;
}

.chip--static {
  cursor: default;
  border-color: var(--line);
  background: #faf6ec;
}

.answer-box {
  display: flex;
  flex-wrap: wrap;
  gap: .45rem;
  align-items: center;
  min-height: 64px;
  padding: .8rem .9rem;
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  border-radius: var(--radius);
  background: var(--paper);
}

.answer-box:empty::before {
  content: attr(data-placeholder);
  color: var(--ink-faint);
  font-size: .9rem;
}

.feedback {
  border-radius: var(--radius-lg);
  padding: .95rem 1.1rem;
  border: 1px solid var(--line);
  background: #fdfaf2;
}

.feedback--ok {
  background: var(--ok-soft);
  border-color: #bcd9c9;
}

.feedback--bad {
  background: var(--bad-soft);
  border-color: #eec7c1;
}

.feedback h3 {
  display: flex;
  align-items: center;
  gap: .5rem;
  font-family: var(--font-ui);
  font-size: .98rem;
  font-weight: 700;
  margin-bottom: .3rem;
}

.feedback h3 svg {
  width: 22px;
  height: 22px;
}

.feedback--ok h3 {
  color: var(--ok);
}

.feedback--bad h3 {
  color: var(--bad);
}

.feedback p {
  margin: 0;
  font-size: .92rem;
  color: #2b3644;
}

.feedback p + p {
  margin-top: .4rem;
}

.lesson-actions {
  display: flex;
  justify-content: flex-end;
  gap: .6rem;
  flex-wrap: wrap;
}

.combo {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  font-size: .78rem;
  font-weight: 700;
  color: #a34a12;
}

/* ---------- Thẻ ghi nhớ / luyện tập ---------- */

.flashcard {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 260px;
  padding: 1.6rem;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--paper);
  box-shadow: var(--shadow-md);
}

.flashcard-word {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 1.2rem + 2.4vw, 2.6rem);
  font-weight: 650;
  color: var(--navy);
}

.flashcard-ipa {
  margin-top: .3rem;
  font-size: .95rem;
  color: var(--ink-faint);
}

.flashcard-back {
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px dashed var(--line-strong);
  text-align: left;
  width: 100%;
}

.grade-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: .5rem;
}

@media (min-width: 620px) {
  .grade-row {
    grid-template-columns: repeat(4, 1fr);
  }
}

.grade {
  display: grid;
  gap: .15rem;
  place-items: center;
  min-height: 56px;
  padding: .45rem .5rem;
  border: 1px solid var(--line-strong);
  border-bottom-width: 3px;
  border-radius: var(--radius);
  background: #fffdf8;
  font-size: .82rem;
  font-weight: 700;
  cursor: pointer;
}

.grade span {
  font-size: .7rem;
  font-weight: 600;
  color: var(--ink-faint);
}

.grade:hover {
  background: #fff;
  border-color: var(--gold-dark);
}

.tile {
  display: grid;
  gap: .4rem;
  align-content: start;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--paper);
  text-decoration: none;
  color: inherit;
  transition: transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}

.tile:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.tile-icon {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--gold-soft);
  color: var(--gold-ink);
}

.tile-icon svg {
  width: 22px;
  height: 22px;
}

.tile h2 {
  margin: 0;
  font-size: 1rem;
  font-family: var(--font-ui);
  font-weight: 700;
}

.tile p {
  margin: 0;
  font-size: .84rem;
  color: var(--ink-muted);
}

/* ---------- Tiến độ ---------- */

.kpi-grid {
  display: grid;
  gap: .8rem;
  grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr));
}

.kpi {
  padding: .9rem 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--paper);
}

.kpi-value {
  display: block;
  font-family: var(--font-display);
  font-size: 1.75rem;
  font-weight: 650;
  color: var(--navy);
  line-height: 1.1;
}

.kpi-label {
  font-size: .75rem;
  font-weight: 650;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.bars {
  display: grid;
  gap: .7rem;
}

.bar-row {
  display: grid;
  grid-template-columns: minmax(90px, 132px) 1fr 3.2rem;
  align-items: center;
  gap: .7rem;
  font-size: .86rem;
}

.bar-track {
  height: 12px;
  border-radius: var(--radius-pill);
  background: #ece4d5;
  overflow: hidden;
}

.bar-track > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--navy-soft);
}

.bar-track--gold > span {
  background: var(--gold);
}

.heatmap {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(12px, 1fr));
  gap: 3px;
}

.heat-cell {
  aspect-ratio: 1;
  border-radius: 3px;
  background: #eee7d9;
}

.heat-cell[data-level="1"] {
  background: #e8d9b6;
}

.heat-cell[data-level="2"] {
  background: #d9c08a;
}

.heat-cell[data-level="3"] {
  background: #c7a45d;
}

.heat-cell[data-level="4"] {
  background: #a98234;
}

.heat-legend {
  display: flex;
  align-items: center;
  gap: .3rem;
  margin-top: .5rem;
  font-size: .72rem;
  color: var(--ink-faint);
}

.heat-legend .heat-cell {
  width: 12px;
  height: 12px;
  aspect-ratio: auto;
}

.badges {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: .7rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.badge-card {
  display: grid;
  gap: .2rem;
  justify-items: center;
  text-align: center;
  padding: .85rem .5rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--paper);
  font-size: .8rem;
  font-weight: 650;
}

.badge-card svg {
  width: 28px;
  height: 28px;
  color: var(--gold-dark);
}

.badge-card--locked {
  opacity: .5;
  background: #f4efe4;
}

.badge-card--locked svg {
  color: #a09a89;
}

.badge-card small {
  font-weight: 500;
  color: var(--ink-faint);
  font-size: .72rem;
}

.standings {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: .25rem;
}

.standing {
  display: grid;
  grid-template-columns: 1.9rem 1fr auto;
  align-items: center;
  gap: .6rem;
  padding: .45rem .6rem;
  border-radius: var(--radius-sm);
  font-size: .88rem;
}

.standing:nth-child(-n+5) {
  background: #fdf8ec;
}

.standing--me {
  outline: 2px solid var(--gold);
  background: #fbf2df;
  font-weight: 700;
}

.standing-rank {
  font-weight: 700;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.standing-xp {
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  color: var(--gold-ink);
}

/* ---------- Thư viện ---------- */

.pdf-card {
  display: grid;
  gap: .55rem;
  align-content: start;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--paper);
}

.pdf-cover {
  display: grid;
  align-content: space-between;
  gap: .5rem;
  aspect-ratio: 3 / 4;
  padding: .9rem;
  border-radius: var(--radius);
  background: linear-gradient(160deg, #0b2138 0%, #07192f 60%, #04101f 100%);
  color: #f6ecd6;
  position: relative;
  overflow: hidden;
}

.pdf-cover::after {
  content: "";
  position: absolute;
  inset: auto -30% -35% -30%;

  background: radial-gradient(ellipse at center, rgba(199, 164, 93, .4), transparent 70%);
}

.pdf-cover-title {
  font-family: var(--font-display);
  font-size: 1.02rem;
  font-weight: 650;
  line-height: 1.2;
  color: #fff8e8;
  position: relative;
}

.pdf-cover-kicker {
  font-size: .62rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #d9c08a;
}

.pdf-cover-meta {
  font-size: .68rem;
  color: #cbb98f;
}

.cite {
  display: grid;
  gap: .2rem;
  padding: .8rem 0;
  border-top: 1px solid var(--line);
  font-size: .88rem;
}

.cite:first-of-type {
  border-top: 0;
  padding-top: .2rem;
}

.cite-title {
  font-weight: 650;
  color: var(--navy);
  line-height: 1.35;
}

.cite-meta {
  font-size: .78rem;
  color: var(--ink-muted);
}

.cite-links {
  display: flex;
  gap: .8rem;
  flex-wrap: wrap;
  font-size: .78rem;
}

.cite-links a {
  font-weight: 650;
}

.search {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 1rem;
}

.search .text-field {
  flex: 1 1 18rem;
}

.filters {
  display: flex;
  gap: .4rem;
  flex-wrap: wrap;
}

.filter {
  min-height: 38px;
  padding: .3rem .8rem;
