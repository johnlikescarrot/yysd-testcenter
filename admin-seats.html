<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kích hoạt trọng lượng · YYSD</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=20260821tfix1">
</head>
<body class="home-minimal teacher-page">
  <main class="minimal-shell minimal-main" style="max-width:880px">
    <p><a href="platform.html">trở về chủ kiểm soát Đài Loan</a></p>
    <h1>kích hoạt trọng lượng</h1>
    <p id="switch-line"></p>
    <p>
      <button type="button" id="switch-on" class="btn btn--primary">mở công tắc chính</button>
      <button type="button" id="switch-off" class="btn">đóng công tắc chính</button>
    </p>
    <p class="auth-msg" id="msg"></p>
    <form id="create" class="auth-form">
      <label class="auth-field"><span>nhân dạng</span>
        <select id="role"><option value="student">Học viên</option><option value="teacher">giáo viên</option></select>
      </label>
      <label class="auth-field"><span>Số điện thoại</span>
        <input id="phone" inputmode="numeric" maxlength="11" placeholder=" tiền tố dùng trước của một người hoặc số thứ tự sinh của các con trong gia đình hoặc để chỉ sự thân mật hoặc quen thuộc người dùng nhất định lấp hoặc nhồi, viết tắt của Tân Cương người dùng chừa trống trong tài liệu ">
      </label>
      <button class="btn btn--primary" type="submit">tạo ra kích hoạt trọng lượng</button>
    </form>
    <div id="list"></div>
  </main>
  <script src="assets/js/auth.js?v=20261013perm1"></script>
  <script>
    var A = window.YYSD_AUTH;
    var msg = document.getElementById("msg");
    function show(t) { msg.textContent = t || ""; }
    function load() {
      A.api("/api/platform/seats").then(function (d) {
        document.getElementById("switch-line").textContent = d.on
          ? " công tắc chính đã mở: học sinh biến thể cũ của giáo viên chỉ có thể sử dụng máy móc đánh quy trình "
          : " công tắc chính ải núi nước đi: trình duyệt vẫn có thể đăng ký quy trình biến thể của | đăng ký Trấn Thành Công hoặc trấn Chengkung ở huyện Đài Đông | có thể ràng buộc này Đài Loan máy tính ";
        var html = "<table><tr><th>trọng lượng</th><th>nhân dạng</th><th>Số điện thoại</th><th>máy tính</th><th>tình trạng</th><th></th></tr>";
        (d.seats || []).forEach(function (s) {
          html += "<tr><td>" + s.code + "</td><td>" + (s.role === "teacher" ? " giáo viên " : " Học viên ") +
            "</td><td>" + (s.phone || " khoảng trống ") + "</td><td>" + (s.device_key ? " đã ràng buộc " : " chưa ràng buộc ") +
            "</td><td>" + (s.disabled ? " ngừng sử dụng " : " có thể sử dụng ") + "</td><td>" +
            "<button data-act='unbind' data-id='" + s.id + "'>loại bỏ</button> " +
            (s.disabled
              ? "<button data-act='enable' data-id='" + s.id + "'>khôi phục</button> "
              : "<button data-act='disable' data-id='" + s.id + "'>ngừng sử dụng</button> ") +
            "<button data-act='password' data-id='" + s.id + "'>thiết lập mã hóa</button></td></tr>";
        });
        document.getElementById("list").innerHTML = html + "</table>";
      }).catch(function (e) { show(e.message); });
    }
    document.getElementById("switch-on").onclick = function () {
      A.api("/api/platform/seat-switch", { method: "POST", body: { on: true } }).then(load).catch(function (e) { show(e.message); });
    };
    document.getElementById("switch-off").onclick = function () {
      A.api("/api/platform/seat-switch", { method: "POST", body: { on: false } }).then(load).catch(function (e) { show(e.message); });
    };
    document.getElementById("create").onsubmit = function (ev) {
      ev.preventDefault();
      A.api("/api/platform/seats", {
        method: "POST",
        body: { role: document.getElementById("role").value, phone: document.getElementById("phone").value.trim() }
      }).then(function () { document.getElementById("phone").value = ""; load(); }).catch(function (e) { show(e.message); });
    };
    document.getElementById("list").onclick = function (ev) {
      var btn = ev.target.closest("button");
      if (!btn) return;
      var id = btn.getAttribute("data-id");
      var act = btn.getAttribute("data-act");
      if (act === "password") {
        var password = window.prompt(" Xinmi trọng lượng(Ít nhất 6 vị trí)");
        if (!password) return;
        A.api("/api/platform/seats/" + id + "/password", { method: "POST", body: { password: password } })
          .then(function () { show(" mã hóa đã thiết lập "); }).catch(function (e) { show(e.message); });
        return;
      }
      A.api("/api/platform/seats/" + id + "/" + act, { method: "POST", body: {} })
        .then(load).catch(function (e) { show(e.message); });
    };
    if (!A.getToken()) location.replace("login.html?next=admin-seats.html");
    else load();
  </script>
</body>
</html>
