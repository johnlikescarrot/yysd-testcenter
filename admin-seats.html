<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mã kích hoạt · YYSD</title>
  <meta name="description" content="Trung tâm Luyện thi IELTS Quốc tế YYSD — Kho đề Cambridge IELTS, từ vựng Anh–Việt, lộ trình thông minh và thư viện PDF học thuật Google Scholar.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=20260821tfix1">
</head>
<body class="home-minimal teacher-page">
  <main class="minimal-shell minimal-main" style="max-width:880px">
    <p><a href="platform.html"> Quay lại bảng điều khiển</a></p>
    <h1>Mã kích hoạt</h1>
    <p id="switch-line"></p>
    <p>
      <button type="button" id="switch-on" class="btn btn--primary">Bật công tắc tổng</button>
      <button type="button" id="switch-off" class="btn">Tắt công tắc tổng</button>
    </p>
    <p class="auth-msg" id="msg"></p>
    <form id="create" class="auth-form">
      <label class="auth-field"><span> Vai trò </span>
        <select id="role"><option value="student">Học viên</option><option value="teacher">Giáo viên</option></select>
      </label>
      <label class="auth-field"><span> Số điện thoại </span>
        <input id="phone" inputmode="numeric" maxlength="11" placeholder="Người dùng cũ bắt buộc điền, người dùng mới để trống">
      </label>
      <button class="btn btn--primary" type="submit">Tạo mã kích hoạt</button>
    </form>
    <div id="list"></div>
  </main>
  <script src="assets/js/auth.js?v=20261013perm1"></script>
  <script>
    var A = window.YYSD_AUTH;
    var msg = document.getElementById("msg");
    function show(t) { msg.textContent = t || ""; }
    function load() {
      A.api("/api/platform/seats").then(function (d) {
        document.getElementById("switch-line").textContent = d.on
          ? " Công tắc tổng đang BẬT: Học viên và giáo viên chỉ có thể sử dụng ứng dụng thi trên máy tính. "
          : " Công tắc tổng đang TẮT: Vẫn có thể đăng nhập trên trình duyệt. Khi đăng nhập trên ứng dụng thi, thiết bị sẽ được liên kết cố định. ";
        var html = "<table><tr><th>Mã kích hoạt</th><th>Vai trò</th><th>Số điện thoại</th><th>Thiết bị</th><th>Trạng thái</th><th></th></tr>";
        (d.seats || []).forEach(function (s) {
          html += "<tr><td>" + s.code + "</td><td>" + (s.role === "teacher"? " Giáo viên ": " Học viên ") +
            "</td><td>" + (s.phone || " Trống ") + "</td><td>" + (s.device_key? " Đã liên kết ": " Chưa liên kết ") +
            "</td><td>" + (s.disabled? " Đã tạm dừng ": " Khả dụng ") + "</td><td>" +
            "<button data-act='unbind' data-id='" + s.id + "'>Hủy liên kết</button> " +
            (s.disabled
              ? "<button data-act='enable' data-id='" + s.id + "'>Khôi phục</button> "
              : "<button data-act='disable' data-id='" + s.id + "'>Tạm dừng</button> ") +
            "<button data-act='password' data-id='" + s.id + "'>Đặt mật khẩu</button></td></tr>";
        });
        document.getElementById("list").innerHTML = html + "</table>";
      }).catch(function (e) { show(e.message); });
    }
    document.getElementById("switch-on").onclick = function () {
      A.api("/api/platform/seat-switch", { method: "POST", body:  true  }).then(load).catch(function (e) { show(e.message); });
    };
    document.getElementById("switch-off").onclick = function () {
      A.api("/api/platform/seat-switch", { method: "POST", body:  false  }).then(load).catch(function (e) { show(e.message); });
    };
    document.getElementById("create").onsubmit = function (ev) {
      ev.preventDefault();
      A.api("/api/platform/seats", {
        method: "POST",
        body: { role: document.getElementById("role").value, phone: document.getElementById("phone").value.trim() }
      }).then(function () { document.getElementById("phone").value = ""; load(); }).catch(function (e) { show(e.message); });
    };
    document.getElementById("list").onclick = function (ev) {
      var btn = ev.target.closest("button");
      if (!btn) return;
      var id = btn.getAttribute("data-id");
      var act = btn.getAttribute("data-act");
      if (act === "password") {
        var password = window.prompt("Nhập mật khẩu mới (tối thiểu 6 ký tự):");
        if (!password) return;
        A.api("/api/platform/seats/" + id + "/password", { method: "POST", body:  password  })
          .then(function () { show("Mật khẩu đã được thiết lập thành công."); }).catch(function (e) { show(e.message); });
        return;
      }
      A.api("/api/platform/seats/" + id + "/" + act, { method: "POST", body: {} })
        .then(load).catch(function (e) { show(e.message); });
    };
    if (!A.getToken()) location.replace("login.html?next=admin-seats.html");
    else load();
  </script>
</body>
</html>
