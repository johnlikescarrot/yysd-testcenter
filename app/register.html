<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký · Hệ thống thi trên máy YYSD</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20261015swiss1">
  <script src="assets/js/gate.js?v=20261020gate1"></script>
  <script src="assets/js/auth.js?v=20261008ui15"></script>
</head>
<body class="auth-page">
  <header class="top"><b>Hệ thống thi trên máy YYSD <small lang="en">YYSD TEST CENTER</small></b>
    <span class="top-acts"><button type="button" id="hit-reload">Làm mới</button></span>
  </header>
  <main class="shell">
    <div class="card">
      <p class="auth-eyebrow" lang="en">CREATE ACCOUNT</p>
      <h1>Đăng ký</h1>
      <p class="lead">Sử dụng mã kích hoạt do quản trị viên cấp để mở tài khoản và liên kết với thiết bị này. </p>
      <form id="f">
        <label class="field">Số điện thoại
          <input type="tel" id="phone" maxlength="11" inputmode="numeric" autocomplete="tel" required>
        </label>
        <label class="field">Thiết lập mật khẩu
          <input type="password" id="password" minlength="6" maxlength="64" autocomplete="new-password" required>
        </label>
        <label class="field">Xác nhận mật khẩu
          <input type="password" id="confirm" minlength="6" maxlength="64" autocomplete="new-password" required>
        </label>
        <label class="field">Mã kích hoạt
          <input id="activationCode" autocomplete="off" placeholder="ABCD-EFGH" required>
        </label>
        <p class="msg" id="msg"></p>
        <button class="btn btn-block" type="submit">Đăng ký và vào thi</button>
      </form>
      <p class="auth-switch">Đã có tài khoản? <a href="login.html"> Đăng nhập ngay</a></p>
    </div>
  </main>
  <script>
    (function () {
      var A = window.YYSD_APP;
      if (A.token()) { location.replace("home.html"); return; }
      A.bindReload(document.getElementById("hit-reload"));
      document.getElementById("f").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var msg = document.getElementById("msg");
        var password = document.getElementById("password").value;
        var confirm = document.getElementById("confirm").value;
        msg.textContent = "";
        if (password !== confirm) { msg.textContent = " Mật khẩu xác nhận không khớp "; return; }
        A.api("/api/auth/register", {
          method: "POST",
          body: {
            phone: document.getElementById("phone").value.trim(),
            password: password,
            confirm: confirm,
            activationCode: document.getElementById("activationCode").value.trim()
          }
        }).then(function (d) {
          A.applyLogin(d);
          location.replace("home.html");
        }).catch(function (e) {
          msg.textContent = e.message || " Đăng ký thất bại ";
        });
      });
    })();
  </script>
</body>
</html>
