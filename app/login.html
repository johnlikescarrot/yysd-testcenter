<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập · máy móc đánh hệ thống</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20261015swiss1">
  <script src="assets/js/gate.js?v=20261020gate1"></script>
  <script src="assets/js/auth.js?v=20261008ui15"></script>
</head>
<body class="auth-page">
  <header class="top"><b>xuất sắc lợi ích suy nghĩ đạt tới máy móc đánh hệ thống<small lang="en">YYSD TEST CENTER</small></b>
    <span class="top-acts"><button type="button" id="hit-reload">cải tiến</button></span>
  </header>
  <main class="shell">
    <div class="card">
      <p class="auth-eyebrow" lang="en">SIGN IN</p>
      <h1>Đăng nhập</h1>
      <p class="lead">điện thoại di động gầm biến thể cũ của mã hóa đăng ký viết tắt của Tân Cương người dùng mời trước đăng ký </p>
      <form id="f">
        <label class="field">Số điện thoại
          <input type="tel" id="phone" maxlength="11" inputmode="numeric" autocomplete="tel" required>
        </label>
        <label class="field">Mật khẩu
          <input type="password" id="password" minlength="6" autocomplete="current-password">
        </label>
        <label class="field">kích hoạt trọng lượng
          <input id="activationCode" autocomplete="off" placeholder=" này Đài Loan máy tính đã ràng buộc có thể chừa trống trong tài liệu ">
        </label>
        <p class="msg" id="msg"></p>
        <button class="btn btn-block" type="submit">đi vào máy móc đánh</button>
      </form>
      <p class="auth-switch">vẫn không có số tài khoản? <a href="register.html">sử dụng kích hoạt trọng lượng đăng ký</a></p>
    </div>
  </main>
  <script>
    (function () {
      var A = window.YYSD_APP;
      var next = new URLSearchParams(location.search).get("next") || "home.html";
      if (A.token()) { location.replace(next); return; }
      A.bindReload(document.getElementById("hit-reload"));
      document.getElementById("f").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var msg = document.getElementById("msg");
        msg.textContent = "";
        A.api("/api/auth/login", {
          method: "POST",
          body: {
            phone: document.getElementById("phone").value.trim(),
            password: document.getElementById("password").value,
            activationCode: document.getElementById("activationCode").value.trim()
          }
        }).then(function (d) {
          A.applyLogin(d);
          location.replace(next);
        }).catch(function (e) {
          msg.textContent = e.message || " đăng ký bị đánh bại ";
        });
      });
    })();
  </script>
</body>
</html>
